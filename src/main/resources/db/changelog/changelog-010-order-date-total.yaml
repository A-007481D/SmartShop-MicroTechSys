databaseChangeLog:
  - changeSet:
      id: 010-add-order-date-total-amount
      author: A-007481D
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: order_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true

              - column:
                  name: total_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: true
